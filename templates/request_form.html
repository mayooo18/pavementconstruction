{% extends "base.html" %}
{% block title %}New Request | PaveFlow{% endblock %}
{% block content %}
<div class="form-panel mx-auto">
    <h1>New Service Request</h1>

    {% if errors %}
    <div class="alert alert-danger">
        <p class="mb-1"><strong>Please fix these problems:</strong></p>
        <ul class="mb-0">
            {% for error in errors %}<li>{{ error }}</li>{% endfor %}
        </ul>
    </div>
    {% endif %}

    <form class="row g-3" method="post">
        <div class="col-md-6"><label class="form-label">Your name</label><input class="form-control" name="name" value="{{ form.get('name', '') }}"></div>
        <div class="col-md-6"><label class="form-label">Email</label><input class="form-control" name="email" type="email" value="{{ form.get('email', '') }}"></div>
        <div class="col-12"><label class="form-label">Property address</label><input class="form-control" name="address" placeholder="123 Main Street" value="{{ form.get('address', '') }}"></div>
        <div class="col-md-6"><label class="form-label">City</label><input class="form-control" name="city" value="{{ form.get('city', '') }}"></div>
        <div class="col-md-2"><label class="form-label">State</label><input class="form-control" name="state" maxlength="2" value="{{ form.get('state', 'IL') }}"></div>
        <div class="col-md-4"><label class="form-label">ZIP code</label><input class="form-control" name="zip_code" value="{{ form.get('zip_code', '') }}"></div>
        <div class="col-md-6"><label class="form-label">Project type</label>
            <select class="form-select" name="project_type">
                {% for option in project_types %}
                <option {% if form.get('project_type') == option %}selected{% endif %}>{{ option }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6"><label class="form-label">Approximate square footage</label><input class="form-control" name="square_footage" type="number" min="1" value="{{ form.get('square_footage', '') }}"></div>
        <div class="col-md-6"><label class="form-label">Pavement condition</label>
            <select class="form-select" name="pavement_condition">
                {% for option in conditions %}
                <option {% if form.get('pavement_condition') == option %}selected{% endif %}>{{ option }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6"><label class="form-label">Preferred inspection date</label><input class="form-control" name="preferred_inspection_date" type="date" value="{{ form.get('preferred_inspection_date', '') }}"></div>
        <div class="col-12"><label class="form-label">Additional details</label><textarea class="form-control" name="additional_details" rows="4">{{ form.get('additional_details', '') }}</textarea></div>
        <div class="col-12"><button class="btn btn-warning" type="submit">Submit request</button></div>
    </form>
</div>
{% endblock %}
