<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}PaveFlow{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">PaveFlow</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('customer_dashboard') }}">Customer</a>
                <a class="nav-link" href="{{ url_for('staff_dashboard') }}">Staff</a>
                <a class="nav-link" href="{{ url_for('login') }}">Login</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
