{% extends "base.html" %}
{% block title %}Customer Dashboard | PaveFlow{% endblock %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <a class="btn btn-warning" href="{{ url_for('request_form') }}">New request</a>

</div>
{% endblock %}
